name: Release build (Linux x64 / Node 22)

# Reproducible build-only workflow. It checks out exact source, installs
# dependencies, generates the Prisma client, runs the repo's existing
# quality checks, runs `next build` targeted at a specific deploy
# environment's public URL, packages a Linux runtime release artifact,
# scans it for secrets in layers, and uploads it as a GitHub Actions
# artifact. It never deploys anywhere, never touches AttHost, and never
# uses production/staging secrets — every build-time env value below is a
# CI-only dummy placeholder, not a real credential, and none of them come
# from repository secrets (this workflow declares none).
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Build target environment (public URL only — no real secrets are ever used)"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # CI-only placeholders, target-independent. These are server-only
      # (never baked into build output) except AUTH_SECRET, which next-auth
      # only reads at runtime, not at build time.
      # DATABASE_URL: deliberately unreachable (port 1 is not a MySQL port
      # anywhere) so the build cannot accidentally reach a real database.
      # The release secret scanner (Layer B below) recognizes ONLY this
      # exact string as an approved dummy — any other mysql:// credential
      # literal found in first-party release files fails the scan.
      DATABASE_URL: "mysql://ci_dummy:ci_dummy@127.0.0.1:1/wexeye_ci_dummy"
      AUTH_SECRET: "ci-build-only-placeholder-not-a-real-secret-0000000000"
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      RESEND_API_KEY: ""
      EMAIL_FROM: ""
      QUARANTINE_DIR: "/tmp/wexeye-ci-quarantine"
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Record commit
        id: commit
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD

      - name: Confirm workflow declares no repository secrets
        # Structural self-check (Layer C, part 1): this workflow must never
        # start reading from the GitHub Actions secrets context. If it ever
        # does, no real secret could have leaked into THIS run (that usage
        # wouldn't exist yet), but failing loudly here stops any future edit
        # that would start feeding real credentials into a build job from
        # ever running unnoticed. The pattern below matches only actual
        # expression-interpolation usage, not prose that merely discusses
        # this check (see this comment block itself, which mentions the
        # words without triggering it).
        run: |
          if grep -nE '\$\{\{[[:space:]]*secrets\.' .github/workflows/release-build.yml; then
            echo "::error::release-build.yml interpolates a value from the GitHub Actions secrets context — this build workflow must never use repository secrets"
            exit 1
          fi
          echo "Confirmed: workflow uses no repository secrets."

      - name: Resolve target environment public URLs
        id: target
        run: |
          case "${{ inputs.target }}" in
            staging)
              echo "auth_url=https://wex3.piotrlask.atthost24.pl" >> "$GITHUB_OUTPUT"
              echo "base_url=https://wex3.piotrlask.atthost24.pl" >> "$GITHUB_OUTPUT"
              ;;
            production)
              echo "auth_url=https://wexeye.com" >> "$GITHUB_OUTPUT"
              echo "base_url=https://wexeye.com" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::unknown build target '${{ inputs.target }}'"
              exit 1
              ;;
          esac

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Versions
        run: |
          node --version
          npm --version

      - name: npm ci
        # Silniki Prisma CLI (schema-engine) również dla serwera produkcyjnego —
        # artefakt zawiera własne narzędzie `prisma migrate deploy` (nie zależy od CLI na serwerze).
        env:
          PRISMA_CLI_BINARY_TARGETS: "debian-openssl-1.0.x,debian-openssl-3.0.x"
        run: npm ci --no-audit --no-fund

      - name: Verify tracked files unchanged after npm ci
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::npm ci modified tracked files"
            git status --porcelain
            exit 1
          fi

      - name: Verify Prisma client (generate only if missing)
        run: |
          if [ -d node_modules/.prisma/client ]; then
            echo "Prisma client already generated (via npm ci postinstall)."
          else
            echo "Prisma client missing, generating explicitly (client generation only, no migrate/push/seed)."
            npx prisma generate
          fi
          test -d node_modules/.prisma/client

      - name: Lint (existing script only)
        run: npm run lint

      - name: Build (next build)
        env:
          AUTH_URL: ${{ steps.target.outputs.auth_url }}
          NEXT_PUBLIC_BASE_URL: ${{ steps.target.outputs.base_url }}
        run: npm run build

      - name: Verify target public URL is bound in build output
        run: |
          set -euo pipefail
          EXPECTED="${{ steps.target.outputs.base_url }}"
          if grep -rlF "$EXPECTED" .next/server >/dev/null 2>&1; then
            echo "TARGET_PUBLIC_URL_BOUND=YES"
          else
            echo "::error::expected public URL $EXPECTED not found in build output"
            echo "TARGET_PUBLIC_URL_BOUND=NO"
            exit 1
          fi
          if grep -rlF "http://localhost:3000" .next/server >/dev/null 2>&1; then
            echo "::error::localhost:3000 is still active as a bound public URL in build output"
            echo "LOCALHOST_PUBLIC_URL_ACTIVE=YES"
            exit 1
          else
            echo "LOCALHOST_PUBLIC_URL_ACTIVE=NO"
          fi

      - name: Determine versions for manifest
        id: versions
        run: |
          echo "next_version=$(node -e "console.log(require('./node_modules/next/package.json').version)")" >> "$GITHUB_OUTPUT"
          echo "prisma_version=$(node -e "console.log(require('./node_modules/prisma/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Package Linux runtime release
        id: package
        run: |
          set -euo pipefail
          SHA="${{ steps.commit.outputs.commit }}"
          REL="release-${SHA}"
          mkdir -p "$REL"

          # next.config.ts now sets output: "standalone", so .next/standalone
          # already contains a traced (production-only) node_modules, the
          # generated server.js, package.json and public/ — a fraction of
          # the size of the full repo node_modules. Only .next/static is not
          # copied in automatically by Next.js and must be added by hand.
          # Passenger's app is registered with startup entry "app.js" by
          # convention, so the generated server.js (which already reads
          # PORT/HOSTNAME from the environment, same as any Passenger Node
          # app) is used directly as app.js rather than kept as a separate
          # custom server — see next.config.ts's comment for why this is
          # safe with the existing custom-server-style app.js it replaces.
          cp -a .next/standalone/. "$REL/"
          mkdir -p "$REL/.next"
          cp -a .next/static "$REL/.next/static"
          mv "$REL/server.js" "$REL/app.js"
          # prisma/ (schema + migrations) for `prisma migrate deploy` on the
          # server; not included in the standalone trace since it's not a
          # runtime import.
          cp -a prisma "$REL/prisma"
          # Narzędzie migracji w artefakcie: CLI prisma + silniki (w tym debian-openssl-1.0.x dla serwera).
          # Uruchamiane przez pipeline wdrożeniowy: node node_modules/prisma/build/index.js migrate deploy
          mkdir -p "$REL/node_modules/@prisma"
          cp -a node_modules/prisma "$REL/node_modules/prisma"
          cp -a node_modules/@prisma/engines "$REL/node_modules/@prisma/engines"
          cp -a node_modules/@prisma/engines-version "$REL/node_modules/@prisma/engines-version"
          cp -a node_modules/@prisma/debug "$REL/node_modules/@prisma/debug" 2>/dev/null || true
          cp -a node_modules/@prisma/fetch-engine "$REL/node_modules/@prisma/fetch-engine" 2>/dev/null || true
          cp -a node_modules/@prisma/get-platform "$REL/node_modules/@prisma/get-platform" 2>/dev/null || true
          # Silnik zapytań dla serwera musi być w artefakcie (binaryTargets w schema.prisma)
          ls "$REL"/node_modules/.prisma/client/ | grep -q "debian-openssl-1.0.x" || { echo "::error::brak silnika debian-openssl-1.0.x w artefakcie"; exit 1; }
          ls node_modules/@prisma/engines/ | grep -q "debian-openssl-1.0.x" || { echo "::error::brak schema-engine debian-openssl-1.0.x"; exit 1; }
          if [ -f .env.example ]; then cp .env.example "$REL/.env.example"; fi

          # Absolute exclusion of anything secret-bearing or upload-derived,
          # even if it somehow existed in the workspace.
          rm -rf "$REL"/.env "$REL"/.env.* "$REL"/.git
          find "$REL" -maxdepth 2 -iname '*.env' -delete 2>/dev/null || true

          echo "release_dir=$REL" >> "$GITHUB_OUTPUT"

      - name: "Secret scan — Layer A: forbidden files (by name, whole release)"
        run: |
          set -euo pipefail
          REL="${{ steps.package.outputs.release_dir }}"
          FAIL=0

          if [ -e "$REL/.env" ] || compgen -G "$REL/.env.*" >/dev/null 2>&1; then
            # .env.example was already copied deliberately and verified
            # placeholder-only; every other .env* form is forbidden.
            if find "$REL" -maxdepth 1 -iname '.env*' ! -iname '.env.example' | grep -q .; then
              echo "::error::release contains a forbidden .env file"; FAIL=1
            fi
          fi
          if [ -d "$REL/.git" ]; then
            echo "::error::release contains .git"; FAIL=1
          fi
          # The repo's own public/uploads/.gitkeep placeholder (see
          # .gitignore) is expected and harmless — the runtime needs that
          # empty directory to exist. Only fail if it actually contains
          # uploaded data (anything other than .gitkeep).
          while IFS= read -r d; do
            if find "$d" -type f ! -name '.gitkeep' | grep -q .; then
              echo "::error::release contains an uploads directory with data: $d"; FAIL=1
            fi
          done < <(find "$REL" -type d -iname '*uploads*' 2>/dev/null || true)
          if find "$REL" -type d -iname '*quarantine*' | grep -q .; then
            echo "::error::release contains a quarantine directory"; FAIL=1
          fi
          if find "$REL" -type f \( -iname '*.pem' -o -iname 'id_rsa*' -o -iname 'id_ed25519*' -o -iname '*.ppk' \) | grep -q .; then
            echo "::error::release contains a private-key-named file"; FAIL=1
          fi
          # prisma/migrations/**/migration.sql is the one expected, legitimate
          # first-party location for .sql files (schema DDL, no data) — it's
          # required at runtime for `prisma migrate deploy` and is excluded
          # here. Anything else named like a dump/backup is forbidden.
          if find "$REL" -type f -iname '*.sql' -not -path "$REL/prisma/migrations/*" | grep -q .; then
            echo "::error::release contains an unexpected .sql file outside prisma/migrations"; FAIL=1
          fi
          if find "$REL" -type f \( -iname '*dump*.gz' -o -iname '*dump*.sql*' -o -iname '*backup*.tar*' -o -iname '*backup*.zip' \) -not -path "$REL/prisma/migrations/*" | grep -q .; then
            echo "::error::release contains a database dump / backup archive"; FAIL=1
          fi
          # Excludes node_modules: "credentials" is a common, benign source
          # filename there (e.g. next-auth's/next-auth's underlying @auth/core's
          # own "Credentials provider" — providers/credentials.js — an auth
          # method name, not a stored credential). First-party code should
          # never have a file named like this.
          if find "$REL" -type f -iname '*credentials*' -not -path "$REL/node_modules/*" | grep -q .; then
            echo "::error::release contains a first-party file named like a credentials file"; FAIL=1
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Layer A (forbidden files) failed"
            exit 1
          fi
          echo "Layer A: PASS"

      - name: "Secret scan — Layer B: first-party content (release minus node_modules)"
        run: |
          set -euo pipefail
          REL="${{ steps.package.outputs.release_dir }}"
          FAIL=0

          # First-party scan target: everything WE authored or WE compiled
          # — app.js, config, prisma/, public/, and our own .next build
          # output. Explicitly excludes node_modules: that's ~1000 packages
          # of third-party source/test fixtures we don't control, where a
          # generic regex reliably produces false positives (publicly known
          # test PEM keys, minified strings that coincidentally match a
          # key-shaped pattern, etc.) rather than real findings. Dependency
          # integrity is instead covered by Layer C below. Also excludes
          # *.map (webpack/Next debug source maps): they encode arbitrary
          # bundled framework content — including plain-English mangled
          # identifiers (e.g. React's own "isPending"/"startTransition"
          # naming can literally produce "re_pending...") — that coincide
          # with key-shaped regexes far more often than real code does.
          SCAN_ARGS=(-rlIE)
          EXCLUDE=(--exclude-dir=node_modules --exclude-dir=.next/dev --exclude=*.map)

          if grep "${SCAN_ARGS[@]}" "${EXCLUDE[@]}" -- '-----BEGIN (RSA |EC |OPENSSH |)PRIVATE KEY-----' "$REL" 2>/dev/null | grep -q .; then
            echo "::error::first-party release content contains private key material"; FAIL=1
          fi

          # DATABASE_URL check: no PCRE/lookahead (grep -E doesn't support
          # it). Detect any mysql:// credential-bearing URL, then confirm
          # every occurrence found is nothing but the one approved CI dummy
          # by stripping that exact literal out and re-checking.
          MYSQL_PATTERN='mysql://[A-Za-z0-9_%.~+-]+:[^@[:space:]"'"'"']{1,}@[A-Za-z0-9_.:-]+/[A-Za-z0-9_.-]+'
          APPROVED_DUMMY='mysql://ci_dummy:ci_dummy@127.0.0.1:1/wexeye_ci_dummy'
          APPROVED_ESCAPED=$(printf '%s' "$APPROVED_DUMMY" | sed -e 's/[\/&]/\\&/g')
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if sed "s/${APPROVED_ESCAPED}//g" "$f" | grep -qE "$MYSQL_PATTERN"; then
              echo "::error::first-party file $f contains a non-dummy DATABASE_URL-shaped credential"; FAIL=1
            fi
          done < <(grep "${SCAN_ARGS[@]}" "${EXCLUDE[@]}" "$MYSQL_PATTERN" "$REL" 2>/dev/null || true)

          if grep "${SCAN_ARGS[@]}" "${EXCLUDE[@]}" 'sk_live_[A-Za-z0-9]{10,}|whsec_[A-Za-z0-9]{10,}|rk_(live|test)_[A-Za-z0-9]{10,}' "$REL" 2>/dev/null | grep -q .; then
            echo "::error::first-party release content contains a Stripe secret-shaped value"; FAIL=1
          fi
          if grep "${SCAN_ARGS[@]}" "${EXCLUDE[@]}" 're_[A-Za-z0-9]{20,}' "$REL" 2>/dev/null | grep -q .; then
            echo "::error::first-party release content contains a Resend API-key-shaped value"; FAIL=1
          fi
          if grep "${SCAN_ARGS[@]}" "${EXCLUDE[@]}" 'AKIA[0-9A-Z]{16}' "$REL" 2>/dev/null | grep -q .; then
            echo "::error::first-party release content contains an AWS-key-shaped value"; FAIL=1
          fi
          if grep "${SCAN_ARGS[@]}" "${EXCLUDE[@]}" 'admin[1]23' "$REL" 2>/dev/null | grep -q .; then
            echo "::error::first-party release content contains the retired admin credential literal"; FAIL=1
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Layer B (first-party content scan) failed"
            exit 1
          fi
          echo "Layer B: PASS"

      - name: "Secret scan — Layer C: dependency-tree structural checks"
        run: |
          set -euo pipefail
          REL="${{ steps.package.outputs.release_dir }}"
          FAIL=0

          # We don't content-scan node_modules (Layer B explicitly excludes
          # it — see rationale there). Instead we verify, structurally, that
          # nothing secret-bearing could have entered it: no env file was
          # ever copied in, and this job never had a real WexEye secret to
          # begin with (confirmed earlier by the "no repository secrets"
          # self-check). Generic test fixtures third-party packages ship
          # (e.g. publicly known sample PEM keys used in their own unit
          # tests) are not WexEye credential leakage and are not flagged.
          if find "$REL/node_modules" -maxdepth 3 -iname '.env*' ! -iname '*.env.example' 2>/dev/null | grep -q .; then
            echo "::error::an .env-named file was found inside node_modules"; FAIL=1
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Layer C (dependency-tree structural checks) failed"
            exit 1
          fi
          echo "Layer C: PASS"

      - name: Create tarball and manifest
        id: artifact
        run: |
          set -euo pipefail
          SHA="${{ steps.commit.outputs.commit }}"
          REL="${{ steps.package.outputs.release_dir }}"
          TARGET="${{ inputs.target }}"
          FILENAME="wexeye-${SHA}-${TARGET}-linux-x64-node22.tar.gz"

          tar -czf "$FILENAME" -C "$REL" .
          BYTES=$(stat -c '%s' "$FILENAME")
          SHA256=$(sha256sum "$FILENAME" | awk '{print $1}')

          cat > release-manifest.txt <<EOF
          APP=WexEye
          ENVIRONMENT=${TARGET}
          GIT_COMMIT=${SHA}
          NODE_VERSION=$(node --version)
          NPM_VERSION=$(npm --version)
          NEXT_VERSION=${{ steps.versions.outputs.next_version }}
          PRISMA_VERSION=${{ steps.versions.outputs.prisma_version }}
          PRISMA_BINARY_TARGETS=native,debian-openssl-1.0.x
          MIGRATE_TOOL=node node_modules/prisma/build/index.js migrate deploy
          BUILD_RESULT=PASS
          PUBLIC_BASE_URL=${{ steps.target.outputs.base_url }}
          PASSENGER_STARTUP_ENTRY=app.js
          PACKAGING_STRATEGY=standalone (next.config.ts output:"standalone"; traced production-only node_modules, generated server.js used as app.js)
          ARTIFACT_FILENAME=${FILENAME}
          ARTIFACT_BYTES=${BYTES}
          ARTIFACT_SHA256=${SHA256}
          BUILD_TIMESTAMP_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"
          echo "bytes=$BYTES" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

          echo "== manifest =="
          cat release-manifest.txt

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.filename }}
          path: |
            ${{ steps.artifact.outputs.filename }}
            release-manifest.txt
          retention-days: 14
          if-no-files-found: error
